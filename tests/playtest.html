<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>playtest</title>
</head>
<body>
  <!-- Builder-only, over http (python3 tests/tools/serve.py): the real game in a same-origin iframe,
       with the tests added to its page. The title reads PASS n or FAIL n. -->
  <pre id="out">running...</pre>
  <iframe id="game" src="../babysitting-rules/index.html" style="width: 1600px; height: 900px; border: 0"></iframe>
  <script>
    var frame = document.getElementById("game");
    // minidom.js is for the parity test in dom.test.js only.
    var TESTS = ["minidom.js", "harness.js", "playthroughs.js", "game.test.js", "dom.test.js"];

    function addScript(w, src) {
      return new Promise(function (resolve, reject) {
        var s = w.document.createElement("script");
        s.src = src;
        s.onload = resolve;
        s.onerror = function () { reject(new Error("could not load " + src)); };
        w.document.body.appendChild(s);
      });
    }

    function wait(ms) { return new Promise(function (resolve) { setTimeout(resolve, ms); }); }

    function report(lines, title) {
      document.getElementById("out").textContent = lines.join("\n");
      document.title = title;
    }

    frame.addEventListener("load", function () {
      var w = frame.contentWindow;
      // Press Start like a player (the DOM tests draw with the real view, which needs a game that's
      // playing), then wait out View.act's 0.35 s so the tests' own clicks count.
      Promise.resolve().then(function () {
        w.Game.useStorage(false);
        w.document.getElementById("title-start").click();
        return wait(400);
      }).then(function () {
        return TESTS.reduce(function (chain, src) {
          return chain.then(function () { return addScript(w, "../tests/" + src); });
        }, Promise.resolve());
      }).then(function () {
        var res = w.runTests();
        var lines = res.failures.map(function (f) { return "FAIL " + f.name + ": " + f.message; });
        lines.push(res.failures.length ? res.failures.length + " FAILED (" + res.passed + " passed)" : "ALL PASS (" + res.passed + " tests)");
        report(lines, res.failures.length ? "FAIL " + res.failures.length : "PASS " + res.passed);
      }).catch(function (e) {
        report([String(e && e.stack || e)], "FAIL load");
      });
    });
  </script>
</body>
</html>
