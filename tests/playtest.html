    window.addEventListener("load", function () {
      var res = runTests();
      var lines = res.failures.map(function (f) { return "FAIL " + f.name + ": " + f.message; });

      document.getElementById("out").textContent = lines.join("\n");
      document.title = res.failures.length ? "FAIL " + res.failures.length : "PASS " + res.passed;
    });
